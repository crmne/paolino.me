<!-- begin header -->
<header class="header hidden-print">
  <div class="container">
    <div class="row">
      <div class="header__inner col col-12 col-d-10 push-d-1 col-m-12 push-m-0">

        <div class="logo">
          <a class="logo__link" href="{{ site.baseurl }}/">
          {%if site.logo %}
            <img class="logo__image" src="{{ site.baseurl }}{{ site.logo }}" alt="{{ site.title }}">
          {% else %}
            {{ site.title }}
          {% endif %}
          </a>
        </div>

        <nav class="main-nav">
          <div class="main-nav__box">
            {% include navigation.html %}
          </div>
        </nav>

        <nav class="top-nav">
          <div class="top-nav__box">
            <button type="button" class="nav__icon-close" aria-label="Close navigation menu">
              <ion-icon name="close"></ion-icon>
            </button>
            <div class="nav-grid">
              <div class="nav-grid__item">
                <h2 class="nav-grid__title">Menu</h2>
                <div class="mobile-nav">
                  {%include navigation.html%}
                </div>
              </div>
            </div>
          </div>
        </nav>

        <div class="nav-buttons">
          <button type="button" class="nav__icon nav__icon-menu" aria-label="Open navigation menu"><ion-icon name="menu-outline"></ion-icon></button>
          <button type="button" class="nav__icon nav__icon-search" aria-label="Open site search"><ion-icon name="search-outline"></ion-icon></button>
          <button type="button" class="nav__icon nav__icon-theme" aria-label="Switch to dark theme" title="Switch theme">
            <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

    </div>
  </div>
</header>
<!-- end header -->

{% include search.html %}
