<!-- begin pagination -->
<nav class="pagination">
  <div class="container">
    <div class="row">
      <div class="col col-12 load-more">
        {% if paginator.next_page %}
        <div class="load-more-section">
          <a class="load-more-posts button button--primary" href="{{ paginator.next_page_path | prepend: site.baseurl }}" rel="next">Load Posts <ion-icon name="arrow-down-outline"></ion-icon></a>
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
<!-- end pagination -->
