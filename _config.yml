#-------------------------------
# Comment Section (Disqus)
disqus-identifier: # crmne # add your shortname for Disqus Comment. For example mr-brown


#-------------------------------
# Newsletter
mailchimp: false
sendfox: true # New setting for SendFox
sendfox_campaigns:
  enabled: true
  skip_in_development: true
  campaign_prefix: "paolino.me"
  post_scope: all
  max_pages: 50
  dry_run: false
  update_existing_draft: true
  fail_build: false
mailchimp-identifier: # Add your MailChimp form identifier. For example - blogenjoyfreedom.us16.list-manage.com/subscribe/post?u=cd56155d76ddeeb4c0bc4d080&amp;id=7a526cd13e
newsletter-title: Newsletter
newsletter-description: Every post, no algorithm in the way.


#-------------------------------
# Google Analytics
google-analytics: # Add your identifier. For example UA-99631805-1.


#-------------------------------
# Build settings
markdown: kramdown
permalink: ':title/'
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-twitter-plugin
  - jekyll-og-image
  - jekyll-ai-visible-content

ai_visible_content:
  enabled: true
  entity:
    type: Person
    id_slug: carmine-paolino
    name: *name
    alternate_names:
      - paolino
      - crmne
    job_title: Software engineer, founder, and musician
    description: a software engineer, founder, and musician building AI products, frameworks, developer tools, and native apps through Plenty. He created RubyLLM, helps organize Berlin.rb, founded Floppy Disco, makes music as Crimson Lake, and previously co-founded Freshflow.
    image: /images/me-04.jpg
    knows_about:
      - Ruby
      - Ruby on Rails
      - Jekyll
      - AI applications
      - Large language models
      - LLM APIs
      - RubyLLM
      - Open source software
      - Async Ruby
      - Developer tooling
      - Product engineering
      - Native desktop applications
      - Linux
      - Startups
      - Music technology
      - House music
    same_as:
      - https://github.com/crmne
      - https://www.linkedin.com/in/carminepaolino
      - https://x.com/paolino
      - https://www.instagram.com/crmne/
      - https://soundcloud.com/crimsonlakemusic
      - https://crimsonlake.live
    author_aliases:
      - paolino
      - crmne
    works_for:
      type: Organization
      name: Plenty
      url: https://plenty.is
    occupation:
      name: Software engineer and open-source maintainer
      skills: Ruby, Rails, AI applications, LLM APIs, open-source software, native desktop applications, developer tooling, Linux, Jekyll, PostgreSQL, asynchronous Ruby
  json_ld:
    auto_inject: false
    include_website_schema: true
    include_breadcrumbs: true
    include_blog_posting: true
    include_faq: true
    include_how_to: true
    article_body: excerpt
    compact: false
  crawlers:
    allow_gptbot: true
    allow_perplexitybot: true
    allow_claudebot: true
    allow_googlebot: true
    allow_bingbot: true
    custom_rules: []
    generate_robots_txt: true
  llms_txt:
    enabled: true
    title: Carmine Paolino
    description: *description
    include_full_text: true
    sections:
      - heading: Core Topics
        content: Ruby, Rails, Jekyll, AI applications, LLM APIs, open source, async Ruby, developer tooling, native desktop applications, Linux, product engineering, startups, music, and communities.
      - heading: Primary Projects
        content: RubyLLM, Chat with Work, Spotifast, ArchSpec, Schematist, hyprmoncfg, Kamal Backup, ZapFast, Cluster Headache Tracker, Jekyll VitePress, Omarchy plugins (OmaStats, OmaTasks for Todoist, Ultimate Guitar Tabs, Lyrics Synced with Music, hyprmoncfg for Omarchy, Active Window + Icon, and Media Controls + Album Art), Berlin.rb, Crimson Lake, Floppy Disco, and Mindscape Productions. Explore the directory at https://paolino.me/projects/.
  linking:
    enable_entity_links: true
    apply_to_metadata: false
    max_links_per_entity_per_post: 1
    enable_related_posts: true
    related_posts_limit: 3
    entity_definitions:
      rubyllm:
        name: RubyLLM
        url: https://rubyllm.com
        description: Ruby framework for building AI applications across model providers.
      ruby:
        name: Ruby
        url: https://www.ruby-lang.org/en/
        description: Programming language used across Carmine Paolino's open-source and product work.
      chat-with-work:
        name: Chat with Work
        url: https://chatwithwork.com
        description: AI tool for querying work data.
      freshflow:
        name: Freshflow
        url: https://freshflow.ai
        description: AI demand forecasting for fresh grocery retail.
      floppy-disco:
        name: Floppy Disco
        url: https://floppydisco.live
        description: Berlin house and disco collective.
      crimson-lake:
        name: Crimson Lake
        url: https://crimsonlake.live
        description: Carmine Paolino's music project.
      cluster-headache-tracker:
        name: Cluster Headache Tracker
        url: https://clusterheadachetracker.com
        description: Open-source app for tracking cluster headaches.
      ruby-on-rails:
        name: Ruby on Rails
        url: https://rubyonrails.org
        description: Web application framework for Ruby.
      rails:
        name: Rails
        url: https://rubyonrails.org
        description: Web application framework for Ruby.
      jekyll:
        name: Jekyll
        url: https://jekyllrb.com
        description: Static site generator used for this website.
      jekyll-vitepress-theme:
        name: Jekyll VitePress Theme
        url: https://jekyll-vitepress.dev
        description: Jekyll documentation theme inspired by VitePress.
      ai-applications:
        name: AI applications
        url: /tag/ai/
        description: Software products and tools built around AI systems.
      large-language-models:
        name: Large language models
        url: /tag/llm/
        description: LLMs and their use in software products.
      llm-apis:
        name: LLM APIs
        url: /tag/llm/
        description: Provider APIs and abstractions for large language models.
      open-source-software:
        name: Open source software
        url: /tag/open-source/
        description: Public software projects and libraries.
      async-ruby:
        name: Async Ruby
        url: /tag/async/
        description: Concurrent and asynchronous Ruby application architecture.
      developer-tooling:
        name: Developer tooling
        url: /tag/developer-experience/
        description: Tools that improve software development workflows.
      native-desktop-applications:
        name: Native desktop applications
        url: /projects/#projects-apps
        description: Native desktop software, including Spotifast and ZapFast.
      linux:
        name: Linux
        url: /tag/linux/
        description: Linux desktop tools, configuration, and native applications.
      product-engineering:
        name: Product engineering
        url: /tag/product-strategy/
        description: Building and operating software products.
      startups:
        name: Startups
        url: /tag/startups/
        description: Company building, product strategy, and bootstrapping.
      music-technology:
        name: Music technology
        url: https://crimsonlake.live
        description: Carmine Paolino's work around music and technology.
      house-music:
        name: House music
        url: https://crimsonlake.live
        description: Carmine Paolino's house and disco music work.
  ai_resources:
    enabled: true
    formats:
      - json
      - yaml
      - markdown
    max_links_per_page: 5
    auto_inject: true
    inject_instruction_block: false
    base_path: /ai
  validation:
    warn_name_inconsistency: true
    warn_missing_same_as: true
    warn_missing_dates: true
    warn_orphan_pages: true
    warn_missing_descriptions: true
    fail_build_on_error: false
    content_only: true
    exclude_paths:
      - /thank-you/
      - /404.html
      - /tag/*
      - /page/*
    verbose: false
    max_examples: 5

paginate: 9
paginate_path: "/page/:num/"

# Pages Path
defaults:
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext

include:
  - _pages

exclude:
  # Source-only artwork notes and previews for projects awaiting announcement.
  - assets/images/projects/README.md
  - assets/images/projects/tonepush.webp
  - assets/images/projects/rekordflash.webp

# Tags
tag_page_dir:         tag
tag_page_layout:      tag_page
tag_permalink_style:  pretty

sass:
  sass_dir: _sass
  style: compressed
  silence_deprecations:
    - import

# Open Graph image generation (https://github.com/crmne/jekyll-og-image)
og_image:
  collections:
    - posts
  output_dir: "assets/images/og"
  force: false
  skip_drafts: true
  domain: "paolino.me"
  image:
    path: "images/me-04_small.jpg"
    width: 140
    height: 140
    radius: 70
  canvas:
    background_color: "#FFFFFF"
  header:
    font_family: "Lora, Bold"
    color: "#17181e"
  content:
    font_family: "Inter, Regular"
    color: "#4a4b51"
  metadata:
    fields:
      - date
      - description
  border_bottom:
    width: 16
    fill:
      - "#17181e"
      - "#ffe66a"
