#-------------------------------
# General Site Settings
title: &name Carmine Paolino
alternate_title: paolino.me
logo: # You can add own logo. For example '/images/logo.png'.
description: &description I build AI products, frameworks, developer tools, and native apps. Creator of RubyLLM, Berlin.rb organizer, and founder of the Floppy Disco music collective.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://paolino.me" # the base hostname & protocol for your site, e.g. http://example.com
lang: en-US
locale: en_US


#-------------------------------
# Author Settings
author:
  name: *name
  url: "https://paolino.me"
  image: '/images/me-04.jpg'
  image_width: 1080
  image_height: 1080
  avatar: '/images/me-04_small.jpg'
  avatar_width: 300
  avatar_height: 300
  picture: '/images/me-04_small.jpg'
  company_name: "Chat with Work"
  company_url: "https://chatwithwork.com"
  company_logo: "https://chatwithwork.com/logotype.svg"
  description: >-
    I build AI frameworks, products, native apps, and developer tools:
    <a href="https://rubyllm.com">RubyLLM</a>, <a href="https://chatwithwork.com">Chat with Work</a>,
    <a href="https://spotifast.rocks">Spotifast</a>, <a href="https://zapfast.rocks">ZapFast</a>,
    <a href="https://archspecrb.dev">ArchSpec</a>, <a href="https://kamal-backup.dev">Kamal Backup</a>,
    and <a href="/projects/">more</a>.
    I help organize <a href="https://berlinrb.org">Berlin.rb</a>, founded <a href="https://floppydisco.live">Floppy Disco</a>,
    and make house and disco as <a href="https://crimsonlake.live">Crimson Lake</a>.
  twitter: paolino

#-------------------------------
# Contact links

# Example of adding a new link to the footer - {icon: "ion-logo-github", link: "https://github.com"}
