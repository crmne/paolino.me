#-------------------------------
# General Site Settings
title: &name Carmine Paolino
alternate_title: paolino.me
logo: # You can add own logo. For example '/images/logo.png'.
description: &description I build AI products, frameworks, developer tools, and native apps at Plenty. Creator of RubyLLM, Berlin.rb organizer, and founder of the Floppy Disco music collective.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://paolino.me" # the base hostname & protocol for your site, e.g. http://example.com
lang: en-US
locale: en_US


#-------------------------------
# Author Settings
author:
  name: *name
  url: "https://paolino.me"
  image: '/images/me-04.jpg'
  image_width: 1080
  image_height: 1080
  avatar: '/images/me-04_small.jpg'
  avatar_width: 300
  avatar_height: 300
  picture: '/images/me-04_small.jpg'
  company_name: "Plenty"
  company_url: "https://plenty.is"
  description: >-
    At <a href="https://plenty.is">Plenty</a>, I build AI frameworks, products, native apps, and developer tools:
    <a href="https://rubyllm.com">RubyLLM</a>, <a href="https://chatwithwork.com">Chat with Work</a>,
    <a href="https://getsolco.com">Solco</a>, <a href="https://spotifast.rocks">Spotifast</a>, <a href="https://zapfast.rocks">ZapFast</a>,
    <a href="https://archspecrb.dev">ArchSpec</a>, <a href="https://kamal-backup.dev">Kamal Backup</a>,
    and <a href="/projects/">more</a>.
    I help organize <a href="https://berlinrb.org">Berlin.rb</a>, founded <a href="https://floppydisco.live">Floppy Disco</a>,
    and make house and disco as <a href="https://crimsonlake.live">Crimson Lake</a>.
  twitter: paolino

#-------------------------------
# Contact links

# Example of adding a new link to the footer - {icon: "ion-logo-github", link: "https://github.com"}
# Other icons can be found at https://ionicons.com/v4/
contact:
- {name: "X", icon: "logo-x", link: "https://x.com/paolino"}
- {name: "GitHub",  icon: "logo-github", link: "https://github.com/crmne"}
- {name: "LinkedIn", icon: "logo-linkedin", link: "https://www.linkedin.com/in/carminepaolino"}
- {name: "Instagram", icon: "logo-instagram", link: "https://www.instagram.com/crmne/"}
- {name: "SoundCloud", icon: "logo-soundcloud", link: "https://soundcloud.com/crimsonlakemusic"}

# Project directory and footer highlights
projects:
- name: Chat with Work
  link: https://chatwithwork.com
  image: {path: /assets/images/projects/chat-with-work-f7ae3fcbcef5.webp, width: 1200, height: 630, alt: "Chat with Work: Your work agent. Not on your laptop. Hosted in the EU, beside a globe with Europe lit", style: screenshot}
  category: Apps
  description: Your work agent, hosted in the EU, not on your laptop. It searches, writes, and codes across every tool your team uses, works on a schedule, and asks before it changes anything in your tools.
  featured: true
- name: Solco
  link: https://getsolco.com
  image: {path: /assets/images/projects/solco.webp, width: 800, height: 420, alt: "Solco: Stop preparing your tracks, above an audio waveform", style: screenshot}
  category: Apps
  description: The DJ library app. Stop preparing your tracks. Solco grids, keys, sorts, and tags every download, then writes the USB your CDJs read. In private alpha.
- name: Spotifast
  link: https://spotifast.rocks
  image: {path: /assets/images/projects/spotifast.webp, width: 800, height: 500, alt: "Spotifast's music library and player", style: screenshot, position: "center top"}
  category: Apps
  description: A lightweight native Spotify client for Linux, macOS, and Windows, with local playback and Spotify Connect.
  featured: true
- name: ZapFast
  link: https://zapfast.rocks
  image: {path: /assets/images/projects/zapfast.webp, width: 800, height: 604, alt: "ZapFast showing chats, attachments, and voice messages", style: screenshot, position: "center top"}
  category: Apps
  description: A native WhatsApp client for Linux, macOS, and Windows, with chats, voice messages, attachments, and notifications.
- name: TonePush
  link: https://tonepush.rocks
  image: {path: /assets/images/projects/tonepush.webp, width: 800, height: 420, alt: "TonePush: Find the tone. Play it on your pedal, above a chain of effect blocks", style: screenshot}
  category: Apps
  description: Guitar tones for your pedal. A catalog website to find presets by artist, song, or original sound and see their signal chains, plus a free, open-source desktop editor that loads them onto your HX Stomp.
- name: Cluster Headache Tracker
  link: https://clusterheadachetracker.com
  image: {path: /assets/images/projects/cluster-headache-tracker.webp, width: 800, height: 800, alt: "Cluster Headache Tracker logo", style: logo, background: "#2b3858"}
  category: Apps
  description: A free, open-source app for logging cluster headaches, spotting patterns, and sharing records with your doctor.
- name: RubyLLM
  link: https://rubyllm.com
  image: {path: /assets/images/projects/rubyllm.webp, width: 800, height: 420, alt: "RubyLLM: Build AI features the Ruby way", style: screenshot}
  category: Libraries & developer tools
  description: A Ruby framework for AI applications, with a consistent interface to major providers. Build agents, chat, structured outputs, and multimodal applications.
  featured: true
- name: MXC for Ruby
  link: https://crmne.github.io/mxc/
  image: {path: /assets/images/projects/mxc.svg, width: 800, height: 450, alt: "MXC for Ruby code setting readable and writable paths and a timeout for a sandboxed command", style: screenshot}
  category: Libraries & developer tools
  description: Run untrusted commands in an OS sandbox from Ruby, with policies for files, network access, and timeouts. An unofficial Ruby binding to Microsoft's MXC.
- name: devhost
  link: https://github.com/crmne/devhost
  image: {path: /assets/images/projects/devhost.svg, width: 800, height: 450, alt: "devhost commands for running Rails and Jekyll with stable HTTPS localhost URLs", style: screenshot}
  category: Libraries & developer tools
  description: Stable HTTPS localhost URLs for Rails, Jekyll, and other local servers on Linux. Each repository and worktree gets its own address, with Caddy handling HTTPS.
- name: ArchSpec
  link: https://archspecrb.dev
  image: {path: /assets/images/projects/archspec.webp, width: 800, height: 420, alt: "ArchSpec: Executable architecture specifications for Ruby and Rails", style: screenshot}
  category: Libraries & developer tools
  description: Executable architecture rules for Ruby and Rails. Check boundaries, dependencies, and conventions on every change.
  featured: true
- name: Schematist
  link: https://github.com/crmne/schematist
  image: {path: /assets/images/projects/schematist.webp, width: 800, height: 575, alt: "A JSON Schema definition written with Schematist", style: screenshot}
  category: Libraries & developer tools
  description: A Ruby DSL for JSON Schema, formerly RubyLLM::Schema. Describe API payloads, configuration, and structured AI outputs.
  featured: true
- name: hyprmoncfg
  link: https://hyprmoncfg.dev
  image: {path: /assets/images/projects/hyprmoncfg.webp, width: 800, height: 451, alt: "The hyprmoncfg terminal editor showing a monitor layout and profile details", style: screenshot, position: "center top"}
  category: Libraries & developer tools
  description: Arrange Hyprland monitors and save display profiles without doing coordinate math.
  featured: true
- name: Kamal Backup
  link: https://kamal-backup.dev
  image: {path: /assets/images/projects/kamal-backup.svg, width: 64, height: 64, alt: "Kamal Backup logo", style: logo}
  category: Libraries & developer tools
  description: Scheduled database and file backups for Rails applications deployed with Kamal.
  featured: true
- name: Jekyll VitePress
  link: https://jekyll-vitepress.dev
