labels:
  accessibility: A concrete barrier to accessing or operating the product.
  bug: A reproducible defect in this project.
  documentation: Incorrect or missing documentation for this project.
  enhancement: A missing capability within the documented product scope.
  invalid: The premise is directly disproved by repository evidence.
  needs-info: One specific missing technical fact prevents investigation.
  out-of-scope: The exact request conflicts with a documented product boundary.
  question: One specific missing technical fact prevents investigation.
  wontfix: The exact request is explicitly ruled out by repository documentation.
sources:
- README.md
- _plugins/*.rb
- _includes/*.html
- _layouts/*.html
replies:
  version: Which version are you using?
  reproduction: What are the shortest steps that reproduce this?
  expected: What did you expect to happen instead?
  error: What is the exact error message? Please remove secrets and personal data.
  page: Which published page has this problem?
  browser: Which browser are you using?
instructions: |
  Triage this project's issues and discussions using the supplied report and
  latest comments. Add at most two justified labels to issues; no labels on
  discussions. For a clear valid report, label silently. Ask for one missing
  non-sensitive fact only when it prevents useful investigation, never for
  information already supplied. Choose source files for a useful technical
  answer and cite only what those files establish; otherwise leave reply null.
  Leave uncertain diagnoses, product decisions, duplicate detection, and closure
  to the maintainer. Do not promise implementation, releases, or tests. Never
  repeat secrets or private data. Keep replies short, direct, and free of status
  chatter, implementation plans, headings, and em dashes.

  This is a personal published site. Do not read, quote, or summarize _drafts/,
  unpublished text, personal contact data, subscriber information, or private
  API responses. Leave personal disputes, prose, biography, factual claims,
  publication dates, newsletters, tracking, and editorial decisions to the author.
  Support for projects merely mentioned on the site is outside its scope.
  Skipping drafts, future posts, sent campaigns, API writes in dry-run mode, or
  SendFox without a local token is expected behavior, not automatically a bug.
